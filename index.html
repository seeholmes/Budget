<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Oink">
  <title>Oink</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root {
      --bg: #f6f1e7;
      --card: #fffdf8;
      --surface2: #f0eadf;
      --text: #25362e;
      --text2: #667169;
      --text3: #929b94;
      --sep: #ded7ca;
      --blue: #246b4d;
      --purple: #7f617f;
      --green: #246b4d;
      --red: #b95f4f;
      --orange: #b9783f;
      --yellow: #c69a3a;
      --coral: #c8705e;
      --papa-soft: #e6f0e9;
      --mama-soft: #f0e7f0;
      --annual-soft: #f4ecd7;
      --warning-soft: #f7eadf;
      --tab-bg: #fffdf8;
      --header-bg: #fffdf8;
      --sidebar-bg: #173d2d;
      --sidebar-text: #fff9ee;
      --sidebar-muted: #b9c9be;
      --summary-bg: #1f6347;
      --summary-text: #fff9ee;
      --display-font: Georgia, 'Times New Roman', serif;
      --surface-shadow: 0 10px 30px rgba(23,61,45,0.07);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #151a17;
        --card: #202722;
        --surface2: #29312b;
        --text: #f5f0e6;
        --text2: #b4beb6;
        --text3: #7f8b82;
        --sep: #39443c;
        --blue: #65b489;
        --purple: #b58eb6;
        --green: #6bc18f;
        --red: #df8978;
        --orange: #d7a267;
        --coral: #df8978;
        --papa-soft: #263c30;
        --mama-soft: #392f3b;
        --annual-soft: #3c3728;
        --warning-soft: #3d3027;
        --tab-bg: #202722;
        --header-bg: #1c231e;
        --sidebar-bg: #0e251b;
        --sidebar-text: #fff9ee;
        --sidebar-muted: #9db0a3;
        --summary-bg: #173d2d;
        --summary-text: #fff9ee;
        --surface-shadow: 0 12px 34px rgba(0,0,0,0.2);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #151a17;
      --card: #202722;
      --surface2: #29312b;
      --text: #f5f0e6;
      --text2: #b4beb6;
      --text3: #7f8b82;
      --sep: #39443c;
      --blue: #65b489;
      --purple: #b58eb6;
      --green: #6bc18f;
      --red: #df8978;
      --orange: #d7a267;
      --coral: #df8978;
      --papa-soft: #263c30;
      --mama-soft: #392f3b;
      --annual-soft: #3c3728;
      --warning-soft: #3d3027;
      --tab-bg: #202722;
      --header-bg: #1c231e;
      --sidebar-bg: #0e251b;
      --sidebar-text: #fff9ee;
      --sidebar-muted: #9db0a3;
      --summary-bg: #173d2d;
      --summary-text: #fff9ee;
      --surface-shadow: 0 12px 34px rgba(0,0,0,0.2);
      color-scheme: dark;
    }
    :root[data-theme="light"] { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; padding: 0; letter-spacing: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
    }
    .icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    #app {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }
    .sidebar { display: contents; }
    .sidebar-brand { display: none; }
    .workspace { display: contents; min-width: 0; }
    /* HEADER */
    .header {
      order: 1;
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--header-bg);
      padding: calc(var(--safe-top) + 14px) 20px 14px;
      border-bottom: 0.5px solid var(--sep);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .title-wrap { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 9px; text-align: left; }
    .title-copy { min-width: 0; }
    .title-heading { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
    .mobile-brand-name { display: none; }
    .brand-logo, .mobile-brand-logo { shape-rendering: geometricPrecision; overflow: hidden; }
    .mobile-brand-logo { display: none; width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0; }
    .header h1 { font-family: var(--display-font); font-size: 19px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .doc-status {
      color: var(--text2);
      font-size: 11px;
      line-height: 1.2;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .doc-status.unsaved { color: var(--orange); }
    .header-actions { display: flex; gap: 12px; align-items: center; }
    .file-actions { gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .hdr-btn {
      background: none; border: none; color: var(--blue);
      font-size: 17px; font-family: inherit; cursor: pointer;
      padding: 4px 0; min-width: 54px; min-height: 44px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .hdr-btn:disabled { color: var(--text3); cursor: default; }
    .file-menu-btn { display: none; }
    .tool-btn {
      border: 1px solid var(--sep);
      background: var(--card);
      color: var(--text);
      border-radius: 8px;
      min-height: 38px;
      padding: 0 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .button-icon { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .tool-btn.primary {
      border-color: var(--blue);
      background: var(--blue);
      color: #fffdf8;
    }
    .theme-btn {
      min-width: 58px;
      color: var(--text);
      border: 1px solid var(--sep);
      border-radius: 8px;
      background: var(--card);
      min-height: 38px;
      font-size: 14px;
      font-weight: 600;
    }
    /* MAIN SCROLL AREA */
    main {
      order: 3;
      padding-bottom: calc(var(--safe-bottom) + 32px);
      min-height: calc(100dvh - 50px);
    }
    /* BOTTOM TAB BAR */
    .tab-bar {
      order: 2;
      position: sticky;
      top: calc(var(--safe-top) + 66px);
      margin: 12px 16px 4px;
      width: auto;
      max-width: none;
      background: var(--tab-bg);
      border: 1px solid var(--sep);
      border-radius: 10px;
      display: flex;
      padding: 5px;
      z-index: 90;
      gap: 4px;
    }
    .tab-btn {
      flex: 1; background: none; border: none;
      display: flex; flex-direction: row; align-items: center; justify-content: center;
      padding: 8px 10px; gap: 8px;
      cursor: pointer; color: var(--text3); font-family: inherit;
      min-height: 40px;
      border-radius: 8px;
    }
    .tab-btn.active { color: var(--blue); background: var(--card); box-shadow: 0 1px 3px rgba(23,61,45,0.1); }
    .tab-btn svg { width: 20px; height: 20px; }
    .tab-btn span { font-size: 13px; font-weight: 600; }
    /* SECTION LABEL */
    .section-label {
      font-size: 13px; font-weight: 600; color: var(--text2);
      text-transform: uppercase;
      padding: 20px 16px 6px;
    }
    .page-intro { padding: 22px 16px 0; }
    .page-eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      color: var(--coral);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .page-eyebrow::before { content: ''; width: 24px; height: 2px; background: var(--coral); }
    .page-heading { font-family: var(--display-font); font-size: 32px; line-height: 1.05; color: var(--blue); }
    .page-subtitle { margin-top: 5px; color: var(--text2); font-size: 14px; }
    /* CARD LIST */
    .card-list {
      background: var(--card);
      border-radius: 8px;
      border: 1px solid var(--sep);
      margin: 0 16px;
      overflow: hidden;
      box-shadow: var(--surface-shadow);
    }
    .card-list + .card-list { margin-top: 0; }
    .list-row {
      display: flex; align-items: center;
      padding: 12px 16px; gap: 12px;
      border-bottom: 0.5px solid var(--sep);
      min-height: 52px;
    }
    .list-row:last-child { border-bottom: none; }
    .row-icon {
      width: 36px; height: 36px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 17px;
    }
    .row-main { flex: 1; min-width: 0; }
    .row-title { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-sub { font-size: 13px; color: var(--text2); margin-top: 1px; }
    .row-right { text-align: right; flex-shrink: 0; }
    .row-amount { font-size: 16px; font-weight: 500; }
    .row-badge {
      font-size: 11px; font-weight: 600; padding: 2px 7px;
      border-radius: 20px; margin-top: 3px; display: inline-block;
    }
    .badge-papa { background: var(--papa-soft); color: var(--blue); }
    .badge-mama { background: var(--mama-soft); color: var(--purple); }
    .badge-due { background: var(--warning-soft); color: var(--red); }
    .badge-soon { background: var(--warning-soft); color: var(--orange); }
    .badge-ok { background: var(--papa-soft); color: var(--green); }
    .badge-yearly { background: var(--annual-soft); color: var(--orange); }
    .personal-tag {
      display: inline-block; margin-left: 5px; padding: 1px 6px;
      border-radius: 10px; background: var(--surface2); color: var(--text2);
      border: 1px solid var(--sep); font-size: 10px; font-weight: 700;
      line-height: 1.35; vertical-align: 1px; text-transform: uppercase;
    }
    /* SUMMARY CARDS */
    .summary-row {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; padding: 16px 16px 0;
    }
    .summary-card {
      background: var(--card); border: 1px solid var(--sep); border-radius: 8px; padding: 16px;
      box-shadow: var(--surface-shadow);
    }
    .summary-card.papa { border-top: 3px solid var(--blue); }
    .summary-card.mama { border-top: 3px solid var(--purple); }
    .sc-label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text2); margin-bottom: 6px; }
    .sc-name { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
    .sc-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
    .sc-row.guidance-detail { color: var(--text2); font-size: 12px; }
    .sc-row.total {
      border-top: 0.5px solid var(--sep); margin-top: 6px;
      padding-top: 6px; font-weight: 600; font-size: 14px;
    }
    .sc-row.total .pos { color: var(--green); }
    .sc-row.total .neg { color: var(--red); }
    .person-name-input {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--surface2);
      color: var(--text);
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      padding: 7px 9px;
      margin-bottom: 8px;
    }
    .person-income-input {
      width: 96px;
      border: 1px solid var(--sep);
      border-radius: 8px;
      background: var(--surface2);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 5px 7px;
      text-align: right;
    }
    /* WIDE CARD */
    .wide-card {
      background: var(--card); border: 1px solid var(--sep); border-radius: 8px;
      margin: 12px 16px 0; padding: 14px;
      box-shadow: var(--surface-shadow);
    }
    .wide-card-title { font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 10px; text-transform: uppercase; }
    .wc-row { display: flex; justify-content: space-between; align-items: center; font-size: 15px; padding: 5px 0; border-bottom: 0.5px solid var(--sep); }
    .wc-row:last-child { border-bottom: none; }
    .wc-row .label { color: var(--text); }
    .wc-row .val { font-weight: 500; }
    .household-summary { padding: 0; overflow: hidden; }
    .household-summary-lead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 20px;
      background: var(--summary-bg);
      color: var(--summary-text);
    }
    .household-summary-kicker { font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .household-summary-caption { margin-top: 4px; font-size: 13px; opacity: 0.78; }
    .household-net { text-align: right; flex-shrink: 0; }
    .household-net span { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; opacity: 0.78; }
    .household-net strong { display: block; margin-top: 2px; font-family: var(--display-font); font-size: 34px; font-weight: 500; line-height: 1; }
    .household-net strong.negative { color: #f2b3a7; }
    .household-summary-rows { padding: 10px 16px 12px; }
    /* FILTER ROW */
    .filter-row {
      display: flex; gap: 8px; padding: 12px 16px 0; overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-chip {
      background: var(--card); border: 1.5px solid var(--sep);
      border-radius: 20px; padding: 6px 14px;
      font-size: 14px; font-weight: 500; color: var(--text2);
      white-space: nowrap; cursor: pointer; font-family: inherit;
      min-height: 36px;
    }
    .filter-chip.active { background: var(--blue); border-color: var(--blue); color: white; }
    /* EDIT INPUT */
    .edit-input {
      background: var(--bg); border: 1.5px solid var(--blue);
      border-radius: 8px; padding: 6px 10px;
      font-size: 15px; font-family: inherit; color: var(--text);
      width: 100px; text-align: right;
    }
    /* SETTINGS */
    .settings-group { margin: 0 16px; background: var(--card); border: 1px solid var(--sep); border-radius: 8px; overflow: hidden; }
    .settings-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 0.5px solid var(--sep); gap: 12px;
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-row label { font-size: 16px; }
    .settings-row .hint { font-size: 13px; color: var(--text2); margin-top: 2px; }
    .btn-danger {
      background: var(--red); color: white; border: none;
      border-radius: 8px; padding: 14px; font-size: 16px;
      font-family: inherit; font-weight: 500; cursor: pointer;
      width: 100%; margin: 0 16px; width: calc(100% - 32px);
    }

    /* CHART */
    .donut-wrap { display:flex; flex-direction:column; align-items:center; padding:14px 0 6px; }
    .legend-list { width:100%; }
    .legend-row { display:flex; align-items:center; padding:7px 0; border-bottom:0.5px solid var(--sep); gap:10px; }
    .legend-row:last-child { border-bottom:none; }
    .legend-dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; }
    .legend-name { flex:1; font-size:15px; }
    .legend-amt { font-size:15px; font-weight:500; }
    .legend-pct { font-size:13px; color:var(--text2); min-width:38px; text-align:right; }
    .split-bar-wrap { padding:4px 0 8px; }
    .split-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .split-label { font-size:13px; color:var(--text2); width:54px; text-align:right; flex-shrink:0; }
    .split-track { flex:1; height:18px; background:var(--sep); border-radius:9px; overflow:hidden; }
    .split-fill { height:100%; border-radius:9px; display:flex; align-items:center; justify-content:flex-end; padding-right:6px; font-size:11px; font-weight:600; color:white; white-space:nowrap; min-width:2px; transition:width 0.4s; }
    .split-val { font-size:13px; font-weight:500; width:54px; flex-shrink:0; }
    /* EMPTY */
    .empty { text-align: center; color: var(--text2); padding: 40px 16px; font-size: 15px; }
    /* CHEVRON */
    .chevron { color: var(--text3); font-size: 13px; margin-left: 4px; }
    /* FORM */
    .add-form { padding: 14px 16px; border-top: 0.5px solid var(--sep); background: var(--bg); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .form-grid.full { grid-template-columns: 1fr; }
    .form-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .form-field[hidden] { display: none; }
    .form-label { font-size: 12px; color: var(--text2); font-weight: 500; padding-left: 2px; }
    .form-input, .form-select {
      background: var(--card); border: 1.5px solid var(--sep);
      border-radius: 8px; padding: 9px 10px;
      font-size: 15px; font-family: inherit; color: var(--text); width: 100%;
      min-width: 0; max-width: 100%;
    }
    .form-input:focus, .form-select:focus { border-color: var(--blue); outline: none; }
    .form-input[type="date"] { padding-left: 0; padding-right: 0; }
    .form-select { -webkit-appearance: none; appearance: none; }
    .form-actions { display: flex; gap: 8px; margin-top: 10px; }
    .transfer-check {
      display: flex; align-items: center; gap: 10px;
      margin-top: 12px; padding: 11px 12px;
      border: 1px solid var(--sep); border-radius: 8px;
      background: var(--surface2); color: var(--text);
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .transfer-check input {
      width: 18px; height: 18px; margin: 0; flex: 0 0 auto;
      accent-color: var(--green);
    }
    .btn-save { flex:1; background: var(--blue); color: white; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-family: inherit; font-weight: 600; cursor: pointer; }
    .btn-cancel { background: var(--sep); color: var(--text); border: none; border-radius: 8px; padding: 12px 18px; font-size: 15px; font-family: inherit; font-weight: 500; cursor: pointer; }
    .btn-add-row { width: 100%; background: none; border: none; color: var(--blue); font-size: 16px; font-family: inherit; padding: 13px 16px; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .del-btn { background: none; border: none; color: var(--red); font-size: 20px; cursor: pointer; padding: 4px 8px; line-height: 1; flex-shrink: 0; }
    /* PAY PERIODS */
    .pay-setup-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }
    .pay-person-setup { min-width: 0; padding-right: 14px; }
    .pay-person-setup + .pay-person-setup { padding-right: 0; padding-left: 14px; border-left: 1px solid var(--sep); }
    .pay-person-title { margin-bottom: 8px; font-family: var(--display-font); font-size: 17px; font-weight: 600; }
    .pay-person-setup.papa .pay-person-title { color: var(--blue); }
    .pay-person-setup.mama .pay-person-title { color: var(--purple); }
    .pay-person-fields { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(120px, 1fr); gap: 10px; }
    .pay-setup-note {
      color: var(--text2);
      font-size: 13px;
      margin-top: 10px;
    }
    .transfer-setup {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(120px, 1fr);
      gap: 10px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 0.5px solid var(--sep);
    }
    .notice-card {
      margin: 12px 16px 0;
      padding: 12px 14px;
      background: var(--warning-soft);
      border: 1px solid color-mix(in srgb, var(--orange) 35%, var(--sep));
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.35;
    }
    .period-card {
      margin: 0 16px 12px;
      background: var(--card);
      border: 1px solid var(--sep);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--surface-shadow);
    }
    .period-card.current { box-shadow: inset 0 0 0 1.5px var(--blue); }
    .period-head {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 330px 18px;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border-bottom: 0.5px solid var(--sep);
    }
    .period-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .period-title { font-family: var(--display-font); font-size: 17px; font-weight: 600; }
    .period-range { color: var(--text2); font-size: 13px; margin-top: 2px; }
    .period-badge {
      color: var(--blue);
      background: var(--papa-soft);
      border-radius: 20px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .ledger-grid { display: grid; grid-template-columns: 1fr 1fr; }
    .ledger { min-width: 0; padding: 14px; }
    .ledger + .ledger { border-left: 0.5px solid var(--sep); }
    .ledger-name { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
    .ledger.papa .ledger-name { color: var(--blue); }

<script>
// ─── DATA ───────────────────────────────────────────────────────────────────
const DEFAULTS = {
  schemaVersion: 7,
  names: { papa: 'Papa', mama: 'Mama' },
  income: { papa: 0, mama: 0 },
  paySchedule: {
    cadence: 'biweekly',
    anchorDates: { papa: '', mama: '' },
    paychecks: { papa: 0, mama: 0 },
    transfer: { from: 'papa', amount: 0 }
  },
  expenses: []
};

const RECOVERY_KEY = 'budget_recovery_v2';
const LEGACY_KEY = 'budget_v1';
const THEME_KEY = 'budget_theme';
const DEFAULT_FILE_NAME = 'Untitled Oink.budget.json';

const clone = value => JSON.parse(JSON.stringify(value));

function normalizeExpense(item, fallbackId, type, sourceSchemaVersion) {
  const normalized = { ...item };
  normalized.id = Number.isFinite(+normalized.id) ? +normalized.id : fallbackId;
  normalized.type = type === 'subscription' ? 'subscription' : 'bill';
  normalized.name = String(normalized.name || '').trim() || (type === 'bill' ? 'New Payment' : 'New Subscription');
  normalized.amount = Number.isFinite(+normalized.amount) ? +normalized.amount : 0;
  normalized.dueDay = Number.isFinite(+normalized.dueDay) ? Math.max(0, Math.min(31, +normalized.dueDay)) : 0;
  normalized.dueMonth = Number.isFinite(+normalized.dueMonth) ? Math.max(1, Math.min(12, +normalized.dueMonth)) : 1;
  normalized.freq = normalized.freq === 'yearly' ? 'yearly' : normalized.freq === 'weekly' ? 'weekly' : 'monthly';
  if (sourceSchemaVersion < 3 && normalized.freq === 'yearly') normalized.amount *= 12;
  normalized.weekday = Number.isFinite(+normalized.weekday) ? Math.max(0, Math.min(6, Math.trunc(+normalized.weekday))) : 5;
  if (normalized.freq !== 'weekly') delete normalized.weekday;
  normalized.cat = normalized.cat || 'misc';
  normalized.includeInTransfer = normalized.includeInTransfer !== false;
  normalized.person = normalized.person === 'mama'
    ? 'mama'
    : normalized.person === 'papa'
      ? 'papa'
      : 'unassigned';
  return normalized;
}

function normalizeBudget(raw) {
  const source = raw && typeof raw === 'object' ? raw : {};
  const sourceSchemaVersion = Number.isFinite(+source.schemaVersion) ? +source.schemaVersion : 1;
  const budget = clone(DEFAULTS);
  budget.names = {
    papa: source.names && source.names.papa ? String(source.names.papa) : 'Papa',
    mama: source.names && source.names.mama ? String(source.names.mama) : 'Mama'
  };
  budget.income = {
    papa: Number.isFinite(+(source.income && source.income.papa)) ? +source.income.papa : 0,
    mama: Number.isFinite(+(source.income && source.income.mama)) ? +source.income.mama : 0
  };
  const sourceSchedule = source.paySchedule && typeof source.paySchedule === 'object' ? source.paySchedule : {};
  const legacyAnchorDate = parseLocalDate(sourceSchedule.anchorDate) ? sourceSchedule.anchorDate : '';
  const sourceAnchorDates = sourceSchedule.anchorDates && typeof sourceSchedule.anchorDates === 'object'
    ? sourceSchedule.anchorDates
    : {};
  budget.paySchedule = {
    cadence: 'biweekly',
    anchorDates: {
      papa: parseLocalDate(sourceAnchorDates.papa) ? sourceAnchorDates.papa : legacyAnchorDate,
      mama: parseLocalDate(sourceAnchorDates.mama) ? sourceAnchorDates.mama : legacyAnchorDate
    },
    paychecks: {
      papa: Number.isFinite(+(sourceSchedule.paychecks && sourceSchedule.paychecks.papa)) ? Math.max(0, +sourceSchedule.paychecks.papa) : 0,
      mama: Number.isFinite(+(sourceSchedule.paychecks && sourceSchedule.paychecks.mama)) ? Math.max(0, +sourceSchedule.paychecks.mama) : 0
    },
    transfer: {
      from: sourceSchedule.transfer && sourceSchedule.transfer.from === 'mama' ? 'mama' : 'papa',
      amount: Number.isFinite(+(sourceSchedule.transfer && sourceSchedule.transfer.amount))
        ? Math.max(0, +sourceSchedule.transfer.amount)
        : 0
    }
  };
  const legacyBills = Array.isArray(source.bills)
    ? source.bills.map(item => ({ ...item, type: 'bill' }))
    : [];
  const legacySubs = Array.isArray(source.subscriptions)
    ? source.subscriptions.map(item => ({ ...item, type: 'subscription' }))
    : [];
  const rawExpenses = Array.isArray(source.expenses) ? source.expenses : [...legacyBills, ...legacySubs];
  budget.expenses = rawExpenses.map((item, index) => normalizeExpense(item, index + 1, item.type, sourceSchemaVersion));
  return budget;
}

function loadInitialBudget() {
  try {
    const recovery = JSON.parse(localStorage.getItem(RECOVERY_KEY));
    if (recovery && recovery.data) {
      return {
        data: normalizeBudget(recovery.data),
        name: recovery.documentName || DEFAULT_FILE_NAME,
        dirty: !!recovery.isDirty
      };
    }
  } catch(e) {}

  try {
    const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY));
    if (legacy) {
      return {
        data: normalizeBudget(legacy),
        name: 'Migrated Oink.budget.json',
        dirty: true
      };
    }
  } catch(e) {}

  return { data: clone(DEFAULTS), name: DEFAULT_FILE_NAME, dirty: false };
}

const initialBudget = loadInitialBudget();
let data = initialBudget.data;
let documentName = initialBudget.name;
let fileHandle = null;
let isDirty = initialBudget.dirty;
let themeMode = localStorage.getItem(THEME_KEY) === 'dark' ? 'dark' : 'light';

function applyTheme() {
  document.documentElement.dataset.theme = themeMode;
  const button = document.getElementById('theme-btn');
  const label = document.getElementById('theme-label');
  const icon = document.getElementById('theme-icon');
  const nextTheme = themeMode === 'dark' ? 'Light' : 'Dark';
  if (button) button.title = `Switch to ${nextTheme.toLowerCase()} mode`;
  if (label) label.textContent = nextTheme;
  if (icon) icon.setAttribute('href', themeMode === 'dark' ? '#icon-sun' : '#icon-moon');
}

function toggleTheme() {
  themeMode = themeMode === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, themeMode);
  applyTheme();
}

function ensureBudgetFileName(name) {
  const trimmed = String(name || DEFAULT_FILE_NAME).trim() || DEFAULT_FILE_NAME;
  return /\.json$/i.test(trimmed) ? trimmed : `${trimmed}.budget.json`;
}

function serializeBudget() {
  return JSON.stringify({
    ...normalizeBudget(data),
    schemaVersion: 7,
    savedAt: new Date().toISOString()
  }, null, 2);
}

function writeRecovery() {
  localStorage.setItem(RECOVERY_KEY, JSON.stringify({
    documentName,
    isDirty,
    data: normalizeBudget(data),
    savedAt: new Date().toISOString()
  }));
}

function updateDocumentChrome() {
  const label = `${documentName}${isDirty ? ' • Unsaved' : ''}`;
  const status = document.getElementById('doc-status');
  const menuStatus = document.getElementById('file-menu-status');
  if (status) {
    status.textContent = label;
    status.classList.toggle('unsaved', isDirty);
  }
  if (menuStatus) menuStatus.textContent = label;
}

function markDirty() {
  isDirty = true;
  writeRecovery();
  updateDocumentChrome();
}

function markSaved(name) {
  if (name) documentName = ensureBudgetFileName(name);
  isDirty = false;
  writeRecovery();
  updateDocumentChrome();
}

function save() { markDirty(); }

function resetTransientState() {
  currentTab = 'home';
  editMode = false;
  billFilter = 'all';
  addingBill = false;
  addingSub = false;
  editingBillId = null;
  editingSubId = null;
  expandedPayPeriods.clear();
  collapsedPayMonths.clear();
  payPeriodsInitialized = false;
}

function confirmDiscardChanges(nextAction) {
  if (!isDirty) return true;
  return confirm(`You have unsaved changes to ${documentName}. ${nextAction || 'Continue'} and lose those changes?`);
}

function openFileMenu() {
  updateDocumentChrome();
  document.getElementById('file-sheet').hidden = false;
}

function closeFileMenu() {
  document.getElementById('file-sheet').hidden = true;
}

async function newBudget() {
  closeFileMenu();
  if (!confirmDiscardChanges('Create a new budget')) return;
  data = clone(DEFAULTS);
  documentName = DEFAULT_FILE_NAME;
  fileHandle = null;
  isDirty = false;
  resetTransientState();
  writeRecovery();
  render();
}

async function openBudget() {
  closeFileMenu();
  if (!confirmDiscardChanges('Open another budget')) return;
  if ('showOpenFilePicker' in window) {
    try {
      const handles = await window.showOpenFilePicker({
        multiple: false,
        types: [{ description: 'Budget JSON', accept: { 'application/json': ['.json'] } }]
      });
      if (!handles.length) return;
      const nextFile = await handles[0].getFile();
      await loadBudgetFromFile(nextFile, handles[0]);
      return;
    } catch(err) {
      if (err && err.name === 'AbortError') return;
      alert('Could not open that budget file.');
      return;
    }
  }

  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,.budget.json,application/json';
  input.onchange = async event => {
    const nextFile = event.target.files[0];
    if (nextFile) await loadBudgetFromFile(nextFile, null);
  };
  input.click();
}

async function loadBudgetFromFile(nextFile, handle) {
  try {
    const parsed = JSON.parse(await nextFile.text());
    data = normalizeBudget(parsed);
    documentName = ensureBudgetFileName(nextFile.name || DEFAULT_FILE_NAME);
    fileHandle = handle;
    isDirty = false;
    resetTransientState();
    writeRecovery();
    render();
  } catch(err) {
    alert('Could not read that budget file. Choose a valid Budget JSON file.');
  }
}

async function saveBudget() {
  closeFileMenu();
  if (fileHandle && 'createWritable' in fileHandle) {
    try {
      await writeBudgetToHandle(fileHandle);
      markSaved(fileHandle.name || documentName);
      return;
    } catch(err) {
      if (err && err.name === 'AbortError') return;
      alert('Could not save to the current file. Choose Save again to pick a file location.');
      return;
    }
  }
  await chooseSaveTarget();
}

async function chooseSaveTarget() {
  closeFileMenu();
  const suggestedName = ensureBudgetFileName(documentName);
  if ('showSaveFilePicker' in window) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName,
        types: [{ description: 'Budget JSON', accept: { 'application/json': ['.json'] } }]
      });
      await writeBudgetToHandle(handle);
      fileHandle = handle;
      markSaved(handle.name || suggestedName);
      return;
    } catch(err) {
      if (err && err.name === 'AbortError') return;
      alert('Could not save that budget file.');
      return;
    }
  }
  downloadBudgetFile(suggestedName);
  markSaved(suggestedName);
}

async function writeBudgetToHandle(handle) {
  const writable = await handle.createWritable();
  await writable.write(serializeBudget());
  await writable.close();
}

function downloadBudgetFile(name) {
  const blob = new Blob([serializeBudget()], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = ensureBudgetFileName(name);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

window.addEventListener('beforeunload', event => {
  if (!isDirty) return;
  event.preventDefault();
  event.returnValue = '';
});

// ─── UTILS ──────────────────────────────────────────────────────────────────
const fmt = n => '$' + Math.round(Math.abs(n)).toLocaleString('en-US');
const fmtSigned = n => (n < 0 ? '–' : '') + fmt(n);
const ownerSoft = person => person === 'papa' ? 'var(--papa-soft)' : person === 'mama' ? 'var(--mama-soft)' : 'var(--warning-soft)';

const CAT_ICONS = {
  housing:'🏠', utilities:'⚡', auto:'🚗', insurance:'🛡️', health:'💪',
  food:'🛒', tech:'💻', debt:'💳', savings:'🏦', home:'🔧',
  misc:'📦', media:'📺', photo:'📷', cloud:'☁️', ai:'🤖',
  sports:'⚽', design:'🎨', education:'🎓', personalCare:'🧴', leisure:'🎟️'
};

const CAT_LABELS = { personalCare: 'Personal Care', leisure: 'Leisure' };
const categoryLabel = category => CAT_LABELS[category] || category[0].toUpperCase() + category.slice(1);

const CAT_COLORS = {
  housing:'#246B4D', utilities:'#B9783F', food:'#5E8A68', auto:'#B95F4F',
  insurance:'#7F617F', health:'#4F8B83', tech:'#586E75', savings:'#C69A3A',
  debt:'#C8705E', home:'#9A7445', misc:'#7A857D', media:'#A45F73',
  photo:'#4E8290', cloud:'#6C91A0', ai:'#876A91', sports:'#5D8A65', design:'#B58A45',
  education:'#A96842', personalCare:'#B06D78', leisure:'#6F7FA6'
};
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function parseLocalDate(value) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value || ''));
  if (!match) return null;
  const date = new Date(+match[1], +match[2] - 1, +match[3]);
  return date.getFullYear() === +match[1] && date.getMonth() === +match[2] - 1 && date.getDate() === +match[3]
    ? date
    : null;
}

function startOfDay(value) {
  const date = new Date(value);
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}

function addDays(value, count) {
  const date = startOfDay(value);
  date.setDate(date.getDate() + count);
  return date;
}

function dateKey(value) {
  const date = startOfDay(value);
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}

function formatPeriodDate(value) {
  return value.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function paydayAnchor(person) {
  return parseLocalDate(data.paySchedule && data.paySchedule.anchorDates && data.paySchedule.anchorDates[person]);
}

function payScheduleReady(person) {
  if (person === 'papa' || person === 'mama') return !!paydayAnchor(person);
  return !!paydayAnchor('papa') && !!paydayAnchor('mama');
}

function monthlyIncome(person) {
  if (!payScheduleReady(person)) return data.income[person] || 0;
  return (data.paySchedule.paychecks[person] || 0) * 26 / 12;
}

function payPeriodStarts(person, count, today = new Date()) {
  let start = paydayAnchor(person);
  if (!start) return [];
  const currentDay = startOfDay(today);
  while (start > currentDay) start = addDays(start, -14);
  while (addDays(start, 14) <= currentDay) start = addDays(start, 14);
  return Array.from({ length: count }, (_, index) => addDays(start, index * 14));
}

function payPeriodCountForRange(months) {
  return months === 12 ? 26 : months === 6 ? 13 : 7;
}

function paydaysInMonth(person, value) {
  const anchor = paydayAnchor(person);
  if (!anchor) return [];
  const year = value.getFullYear();
  const month = value.getMonth();
  const first = new Date(year, month, 1);
  const last = new Date(year, month + 1, 0);
  let payday = startOfDay(anchor);
  while (payday > first) payday = addDays(payday, -14);
  while (payday < first) payday = addDays(payday, 14);
  const dates = [];
  while (payday <= last) {
    dates.push(payday);
    payday = addDays(payday, 14);
  }
  return dates;
}

function paydaysBetween(person, start, end) {
  const anchor = paydayAnchor(person);
  if (!anchor) return [];
  let payday = startOfDay(anchor);
  while (payday >= end) payday = addDays(payday, -14);
  while (payday < start) payday = addDays(payday, 14);
  const dates = [];
  while (payday < end) {
    dates.push(payday);
    payday = addDays(payday, 14);
  }
  return dates;
}

function expenseOccursOn(expense, date) {
  if (expense.freq === 'weekly') return date.getDay() === expense.weekday;
  const dueDay = Math.max(1, expense.dueDay || 1);
  if (expense.freq === 'yearly' && date.getMonth() + 1 !== expense.dueMonth) return false;
  if (expense.freq === 'monthly' && !expense.dueDay) return false;
  const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
  return date.getDate() === Math.min(dueDay, lastDay);
}

function expenseOccurrences(person, start, end) {
  const owned = data.expenses.filter(expense => expense.person === person);
  const occurrences = [];
  for (let date = startOfDay(start); date < end; date = addDays(date, 1)) {
    for (const expense of owned) {
      if (expenseOccursOn(expense, date)) occurrences.push({ expense, date });
    }
  }
  return occurrences.sort((a, b) => a.date - b.date || a.expense.name.localeCompare(b.expense.name));
}

function ledgerForPeriod(person, start) {
  const end = addDays(start, 14);
  const items = expenseOccurrences(person, start, end);
  const paycheck = data.paySchedule.paychecks[person] || 0;
  const expenseOutgoing = items.reduce((sum, item) => sum + item.expense.amount, 0);
  const transfer = data.paySchedule.transfer || DEFAULTS.paySchedule.transfer;
  const transferTo = transfer.from === 'papa' ? 'mama' : 'papa';
  const transferDates = paydaysBetween(transfer.from, start, end);
  const transferTotal = transfer.amount * transferDates.length;
  const transferOut = person === transfer.from ? transferTotal : 0;
  const transferIn = person === transferTo ? transferTotal : 0;
  const income = paycheck + transferIn;
  const outgoing = expenseOutgoing + transferOut;
  return {
    person, start, end, paycheck, expenseOutgoing, transferIn, transferOut, transferDates,
    income, outgoing, net: income - outgoing, items
  };
}

function payPeriodMonthReconciliations(person, starts) {
  const months = new Map();
  for (const start of starts) {
    const monthKey = `${start.getFullYear()}-${start.getMonth()}`;
    if (!months.has(monthKey)) {
      months.set(monthKey, { income: 0, outgoing: 0, net: 0, periods: new Map() });
    }
    const ledger = ledgerForPeriod(person, start);
    const month = months.get(monthKey);
    month.income += ledger.income;
    month.outgoing += ledger.outgoing;
    month.net += ledger.net;
    month.periods.set(dateKey(start), ledger);
  }
  return months;
}

function nextAnnualOccurrence(expense, today = new Date()) {
  const currentDay = startOfDay(today);
  const month = Math.max(1, Math.min(12, expense.dueMonth || 1));
  const makeDate = year => {
    const lastDay = new Date(year, month, 0).getDate();
    return new Date(year, month - 1, Math.min(Math.max(1, expense.dueDay || 1), lastDay));
  };
  let date = makeDate(currentDay.getFullYear());
  if (date < currentDay) date = makeDate(currentDay.getFullYear() + 1);
  return date;
}

function daysUntil(dueDay, dueMonth) {
  const today = startOfDay(new Date());
  const dateInMonth = (year, monthIndex, day) => {
    const lastDay = new Date(year, monthIndex + 1, 0).getDate();
    return new Date(year, monthIndex, Math.min(Math.max(1, day || 1), lastDay));
  };

  if (dueMonth) {
    let target = dateInMonth(today.getFullYear(), dueMonth - 1, dueDay);
    if (target < today) target = dateInMonth(today.getFullYear() + 1, dueMonth - 1, dueDay);
    return Math.round((target - today) / 86400000);
  }
  if (!dueDay) return null;
  let target = dateInMonth(today.getFullYear(), today.getMonth(), dueDay);
  if (target < today) target = dateInMonth(today.getFullYear(), today.getMonth() + 1, dueDay);
  return Math.round((target - today) / 86400000);
}

function daysUntilWeekday(weekday) {
  const today = startOfDay(new Date());
  return (weekday - today.getDay() + 7) % 7;
}

function dueLabel(bill) {
  if (bill.freq === 'weekly') return `Every ${WEEKDAYS[bill.weekday]}`;
  if (bill.freq === 'yearly') return `${MONTHS[bill.dueMonth-1]} ${bill.dueDay || 1}`;
  if (!bill.dueDay) return 'Various';
  const d = bill.dueDay;
  const teen = d % 100 >= 11 && d % 100 <= 13;
  const suffix = teen ? 'th' : d % 10 === 1 ? 'st' : d % 10 === 2 ? 'nd' : d % 10 === 3 ? 'rd' : 'th';
  return d + suffix;
}

function monthlyEquiv(bill) {
  if (bill.freq === 'yearly') return bill.amount / 12;
  if (bill.freq === 'weekly') return bill.amount * 52 / 12;
  return bill.amount;
}

function expensesOf(type) {
  return data.expenses.filter(item => item.type === type);
}

function nextExpenseId() {
  return data.expenses.length ? Math.max(...data.expenses.map(item => item.id)) + 1 : 1;
}

function expensesFor(person) {
  return data.expenses.filter(expense => expense.person === person);
}

function totalMonthly(person) {
  return expensesFor(person).reduce((sum, expense) => sum + monthlyEquiv(expense), 0);
}

function transferMonthly(person) {
  return expensesFor(person)
    .filter(expense => expense.includeInTransfer !== false)
    .reduce((sum, expense) => sum + monthlyEquiv(expense), 0);
}

function totalHouseholdMonthly() {
  return data.expenses.reduce((sum, expense) => sum + monthlyEquiv(expense), 0);
}

// Returns positive if papa sends to mama, negative if mama sends to papa
function calcExchange() {
  const papaNet = monthlyIncome('papa') - transferMonthly('papa');
  const mamaNet = monthlyIncome('mama') - transferMonthly('mama');
  return (papaNet - mamaNet) / 2;
}

function personalTag(expense) {
  return expense.includeInTransfer === false ? '<span class="personal-tag">Personal</span>' : '';
}

function monthlyToBiweekly(amount) {
  return Math.abs(amount) * 12 / 26;
}

// ─── STATE ───────────────────────────────────────────────────────────────────
let currentTab = 'home';
let editMode = false;
let billFilter = 'all';
let addingBill = false;
let addingSub = false;
let editingBillId = null;
let editingSubId = null;
const LEDGER_PERSON_KEY = 'budget_ledger_person';
const LEDGER_RANGE_KEY = 'budget_ledger_range';
let ledgerPerson = localStorage.getItem(LEDGER_PERSON_KEY) === 'mama' ? 'mama' : 'papa';
let ledgerRangeMonths = [3, 6, 12].includes(+localStorage.getItem(LEDGER_RANGE_KEY))
  ? +localStorage.getItem(LEDGER_RANGE_KEY)
  : 3;
let expandedPayPeriods = new Set();
let collapsedPayMonths = new Set();
let payPeriodsInitialized = false;

function updateEditButton() {
  const label = document.getElementById('edit-label');
  const icon = document.getElementById('edit-icon');
  if (label) label.textContent = editMode ? 'Done' : 'Delete';
  if (icon) icon.setAttribute('href', editMode ? '#icon-check' : '#icon-trash');
}

function switchTab(tab) {
  currentTab = tab;
  editMode = false;
  billFilter = 'all';
  addingBill = false;
  addingSub = false;
  editingBillId = null;
  editingSubId = null;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  updateEditButton();
  render();
}

function toggleEdit() {
  editMode = !editMode;
  updateEditButton();
  render();
}

function setLedgerPerson(person) {
  ledgerPerson = person === 'mama' ? 'mama' : 'papa';
  localStorage.setItem(LEDGER_PERSON_KEY, ledgerPerson);
  expandedPayPeriods.clear();
  payPeriodsInitialized = false;
  render();
}

function setLedgerRange(months) {
  ledgerRangeMonths = [3, 6, 12].includes(+months) ? +months : 3;
  localStorage.setItem(LEDGER_RANGE_KEY, String(ledgerRangeMonths));
  expandedPayPeriods.clear();
  payPeriodsInitialized = false;
  render();
}

function togglePayPeriod(key) {
  if (expandedPayPeriods.has(key)) expandedPayPeriods.delete(key);
  else expandedPayPeriods.add(key);
  render();
}

function payMonthStateKey(person, value) {
  return `${person}-${value.getFullYear()}-${value.getMonth()}`;
}

function togglePayMonth(key) {
  if (collapsedPayMonths.has(key)) collapsedPayMonths.delete(key);
  else collapsedPayMonths.add(key);
  render();
}

function setAllPayPeriods(expand) {
  const starts = payPeriodStarts(ledgerPerson, payPeriodCountForRange(ledgerRangeMonths), startOfDay(new Date()));
  expandedPayPeriods = expand ? new Set(starts.map(dateKey)) : new Set();
  const monthKeys = new Set(starts.map(start => payMonthStateKey(ledgerPerson, start)));
  for (const key of monthKeys) {
    if (expand) collapsedPayMonths.delete(key);
    else collapsedPayMonths.add(key);
  }
  payPeriodsInitialized = true;
  render();
}

// ─── RENDER PAY PERIODS ──────────────────────────────────────────────────────
function renderPersonLedger(ledger, currentDay = null) {
  const person = ledger.person;
  const netColor = ledger.net >= 0 ? 'var(--green)' : 'var(--red)';
  const otherPerson = person === 'papa' ? 'mama' : 'papa';
  const pastCutoff = currentDay ? startOfDay(currentDay) : null;
  const transactions = [{
    date: ledger.start,
    name: `${data.names[person]} paycheck`,
    type: 'Paycheck',
    incoming: ledger.paycheck,
    outgoing: 0,
    order: 0
  }];
  const transferAmount = data.paySchedule.transfer.amount || 0;
  if (ledger.transferIn) ledger.transferDates.forEach(date => transactions.push({
    date,
    name: `Transfer from ${data.names[otherPerson]}`,
    type: 'Transfer',
    incoming: transferAmount,
    outgoing: 0,
    order: 1
  }));
  if (ledger.transferOut) ledger.transferDates.forEach(date => transactions.push({
    date,
    name: `Transfer to ${data.names[otherPerson]}`,
    type: 'Transfer',
    incoming: 0,
    outgoing: transferAmount,
    order: 1
  }));
  ledger.items.forEach(({ expense, date }) => transactions.push({
    date,
    name: expense.name,
    type: `${expense.type === 'subscription' ? 'Subscription' : 'Payment'}${expense.includeInTransfer === false ? ' · Personal' : ''}`,
    incoming: 0,
    outgoing: expense.amount,
    order: 2,
    isPast: !!pastCutoff && date < pastCutoff
  }));
  transactions.sort((a, b) => a.date - b.date || a.order - b.order || a.name.localeCompare(b.name));
  let running = 0;
  const tableRows = transactions.map(transaction => {
    running += transaction.incoming - transaction.outgoing;
    return `<tr${transaction.isPast ? ' class="past-expense"' : ''}>
      <td>${formatPeriodDate(transaction.date)}</td>
      <td>${transaction.name}</td>
      <td><span class="transaction-type">${transaction.type}</span></td>
      <td class="money incoming">${transaction.incoming ? `+${fmt(transaction.incoming)}` : ''}</td>
      <td class="money">${transaction.outgoing ? `-${fmt(transaction.outgoing)}` : ''}</td>
      <td class="money running" style="color:${running >= 0 ? 'var(--green)' : 'var(--red)'}">${fmtSigned(running)}</td>
    </tr>`;
  }).join('');
  const transferItems = ledger.transferIn
    ? ledger.transferDates.map(date => `<div class="ledger-item">
        <div>
          <div class="ledger-item-name">Payday transfer</div>
          <div class="ledger-item-date">${formatPeriodDate(date)} · From ${data.names[otherPerson]}</div>
        </div>
        <div class="ledger-item-amount incoming">+${fmt(transferAmount)}</div>
      </div>`).join('')
    : ledger.transferOut
      ? ledger.transferDates.map(date => `<div class="ledger-item">
          <div>
            <div class="ledger-item-name">Payday transfer</div>
            <div class="ledger-item-date">${formatPeriodDate(date)} · To ${data.names[otherPerson]}</div>
          </div>
          <div class="ledger-item-amount">–${fmt(transferAmount)}</div>
        </div>`).join('')
      : '';
  const expenseItems = ledger.items.map(({ expense, date }) => `<div class="ledger-item${pastCutoff && date < pastCutoff ? ' past-expense' : ''}">
        <div>
          <div class="ledger-item-name">${expense.name}</div>
          <div class="ledger-item-date">${formatPeriodDate(date)} · ${expense.type === 'subscription' ? 'Subscription' : 'Payment'}${expense.freq === 'yearly' ? ' · Annual' : expense.freq === 'weekly' ? ' · Weekly' : ''}${expense.includeInTransfer === false ? ' · Personal' : ''}</div>
        </div>
        <div class="ledger-item-amount">–${fmt(expense.amount)}</div>
      </div>`).join('');
  const items = (transferItems || expenseItems)
    ? transferItems + expenseItems
    : `<div class="ledger-empty">No payments due</div>`;

  return `<section class="ledger ${person}">
    <div class="ledger-name">${data.names[person]}</div>
    <div class="ledger-summary">
      <div><div class="ledger-stat-label">Incoming</div><div class="ledger-stat-value" style="color:var(--green)">${fmt(ledger.income)}</div><div class="ledger-stat-detail">Pay ${fmt(ledger.paycheck)}${ledger.transferIn ? ` + transfer ${fmt(ledger.transferIn)}` : ''}</div></div>
      <div><div class="ledger-stat-label">Outgoing</div><div class="ledger-stat-value" style="color:var(--red)">${fmt(ledger.outgoing)}</div><div class="ledger-stat-detail">Expenses ${fmt(ledger.expenseOutgoing)}${ledger.transferOut ? ` + transfer ${fmt(ledger.transferOut)}` : ''}</div></div>
      <div><div class="ledger-stat-label">Remaining</div><div class="ledger-stat-value" style="color:${netColor}">${fmtSigned(ledger.net)}</div></div>
    </div>
    <div class="ledger-items ledger-mobile-items">${items}</div>
    <div class="ledger-table-wrap">
      <table class="ledger-table">
        <thead><tr><th>Date</th><th>Description</th><th>Type</th><th class="money">Money In</th><th class="money">Money Out</th><th class="money">Running</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>
  </section>`;
}

function renderAnnualLookahead() {
  const now = startOfDay(new Date());
  const annual = data.expenses
    .filter(expense => expense.freq === 'yearly')
    .map(expense => ({ expense, date: nextAnnualOccurrence(expense, now) }))
    .sort((a, b) => a.date - b.date || b.expense.amount - a.expense.amount)
    .slice(0, 5);

  if (!annual.length) return '';
  let html = `<div class="section-label">Next Annual Payments</div><div class="card-list">`;
  for (const { expense, date } of annual) {
    const days = Math.round((date - now) / 86400000);
    const owner = expense.person === 'unassigned' ? 'Needs assignment' : data.names[expense.person];
    html += `<div class="list-row">
      <div class="row-icon" style="background:var(--annual-soft)">${CAT_ICONS[expense.cat] || '📋'}</div>
      <div class="row-main">
        <div class="row-title">${expense.name}</div>
        <div class="row-sub" style="color:var(--orange)">${owner} · ${date.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' })}${personalTag(expense)}</div>
      </div>
      <div class="row-right">
        <div class="row-amount">${fmt(expense.amount)}</div>
        <div style="font-size:12px;color:${days <= 60 ? 'var(--orange)' : 'var(--text2)'}">${days === 0 ? 'today' : `in ${days}d`}</div>
      </div>
    </div>`;
  }
  return html + `</div>`;
}

    payPeriodsInitialized = true;
  }
  const monthReconciliations = payPeriodMonthReconciliations(ledgerPerson, starts);
  let previousMonth = '';
  let isMonthExpanded = true;
  for (const start of starts) {
    const monthKey = `${start.getFullYear()}-${start.getMonth()}`;
    const month = monthReconciliations.get(monthKey);
    if (monthKey !== previousMonth) {
      if (previousMonth) html += `</div></section>`;
      const isThreePaycheckMonth = month.periods.size === 3;
      const stateKey = payMonthStateKey(ledgerPerson, start);
      isMonthExpanded = !collapsedPayMonths.has(stateKey);
      html += `<section class="pay-month-group">
      <button class="pay-month-head${isThreePaycheckMonth ? ' three-paycheck' : ''}" type="button" aria-expanded="${isMonthExpanded}" onclick="togglePayMonth('${stateKey}')">
        <div class="pay-month-title">
          <span class="pay-month-name">${MONTHS_FULL[start.getMonth()]} ${start.getFullYear()}</span>
          ${isThreePaycheckMonth ? '<span class="three-paycheck-badge">3 paychecks</span>' : ''}
        </div>
        <div class="pay-month-summary" aria-label="Monthly reconciliation">
          <div class="pay-month-stat"><span class="pay-month-stat-label">Incoming</span><span class="pay-month-stat-value" style="color:var(--green)">${fmt(month.income)}</span></div>
          <div class="pay-month-stat"><span class="pay-month-stat-label">Outgoing</span><span class="pay-month-stat-value" style="color:var(--red)">${fmt(month.outgoing)}</span></div>
          <div class="pay-month-stat"><span class="pay-month-stat-label">Net</span><span class="pay-month-stat-value" style="color:${month.net >= 0 ? 'var(--green)' : 'var(--red)'}">${fmtSigned(month.net)}</span></div>
        </div>
        <span class="pay-month-end"><span class="pay-month-chevron" aria-hidden="true">&rsaquo;</span></span>
      </button>
      <div class="pay-month-periods">`;
      previousMonth = monthKey;
    }
    if (!isMonthExpanded) continue;
    const end = addDays(start, 14);
    const key = dateKey(start);
    const ledger = month.periods.get(key);
    const isCurrent = today >= start && today < end;
    const isExpanded = expandedPayPeriods.has(key);
    html += `<article class="period-card${isCurrent ? ' current' : ''}">
      <button class="period-head" type="button" aria-expanded="${isExpanded}" onclick="togglePayPeriod('${key}')">
        <div class="period-head-main">
          <div class="period-title-row">
            <div class="period-title">Payday ${formatPeriodDate(start)}</div>
            ${isCurrent ? `<span class="period-badge">Current</span>` : ''}
          </div>
          <div class="period-range">${formatPeriodDate(start)} – ${formatPeriodDate(addDays(end, -1))}</div>
        </div>
        <div class="period-head-summary">
          <div><span class="period-mini-label">Incoming</span><span class="period-mini-value" style="color:var(--green)">${fmt(ledger.income)}</span></div>
          <div><span class="period-mini-label">Outgoing</span><span class="period-mini-value" style="color:var(--red)">${fmt(ledger.outgoing)}</span></div>
          <div><span class="period-mini-label">Remaining</span><span class="period-mini-value" style="color:${ledger.net >= 0 ? 'var(--green)' : 'var(--red)'}">${fmtSigned(ledger.net)}</span></div>
        </div>
        <div class="period-head-end">
          <span class="period-chevron" aria-hidden="true">&rsaquo;</span>
        </div>
      </button>
      ${isExpanded ? `<div class="ledger-grid single">${renderPersonLedger(ledger, isCurrent ? today : null)}</div>` : ''}
    </article>`;
  }
  if (previousMonth) html += `</div></section>`;
  return html;
}

// ─── RENDER BILLS ─────────────────────────────────────────────────────────────
function renderBills() {
  let bills = expensesOf('bill');
  if (billFilter !== 'all') bills = bills.filter(b => b.person === billFilter);
  const billFilters = ['all','papa','mama'];
  if (expensesOf('bill').some(b => b.person === 'unassigned')) billFilters.push('unassigned');

  const monthly = bills.filter(b => b.freq === 'monthly').sort((a,b) => {
    if (!a.dueDay && !b.dueDay) return 0;
    if (!a.dueDay) return 1;
    if (!b.dueDay) return -1;
    return a.dueDay - b.dueDay;
  });
  const weekly = bills.filter(b => b.freq === 'weekly').sort((a,b) => a.weekday - b.weekday || a.name.localeCompare(b.name));
  const yearly = bills.filter(b => b.freq === 'yearly').sort((a,b) => a.dueMonth - b.dueMonth);

  const totalW = weekly.reduce((sum,bill)=>sum+bill.amount,0);
  const totalM = bills.filter(b=>b.freq==='monthly').reduce((s,b)=>s+b.amount,0);
  const totalY = bills.filter(b=>b.freq==='yearly').reduce((s,b)=>s+b.amount,0);

  let html = `<div class="filter-row">
    ${billFilters.map(f=>`<button class="filter-chip${billFilter===f?' active':''}" onclick="setBillFilter('${f}')">${f==='all' ? 'All Spending' : f === 'unassigned' ? 'Needs assignment' : data.names[f]}</button>`).join('')}
  </div>`;

  if (weekly.length) {
    html += `<div class="section-label">Weekly Payments</div><div class="card-list expense-list">
      <div class="expense-table-head"><span></span><span>Item</span><span>Schedule</span><span>Amount</span><span></span></div>`;
    for (const b of weekly) {
      if (editingBillId === b.id) {
        html += itemForm('bill', b);
        continue;

      const days = daysUntilWeekday(b.weekday);
      const personColor = b.person === 'papa' ? 'var(--blue)' : b.person === 'mama' ? 'var(--purple)' : 'var(--orange)';
      const personName = b.person === 'unassigned' ? 'Needs assignment' : data.names[b.person];
      html += `<div class="list-row" style="cursor:pointer" onclick="editingBillId=${b.id};addingBill=false;render()">
        <div class="row-icon" style="background:${ownerSoft(b.person)}">${CAT_ICONS[b.cat]||'📋'}</div>
        <div class="row-main">
          <div class="row-title">${b.name}</div>
          <div class="row-sub" style="color:${personColor}">${personName} · Every ${WEEKDAYS[b.weekday]} · ${fmt(b.amount*52)}/yr${personalTag(b)}</div>
        </div>
        <div class="row-schedule">Every ${WEEKDAYS[b.weekday]}</div>
        <div class="row-right">
          <div class="row-amount">${fmt(b.amount)}/wk</div>
          <div style="font-size:12px;color:${days <= 1 ? 'var(--orange)' : 'var(--text3)'};text-align:right">${days === 0 ? 'TODAY' : `in ${days}d`}</div>
        </div>
        ${editMode ? `<button class="del-btn" onclick="event.stopPropagation();deleteBill(${b.id})">−</button>` : `<span class="chevron">›</span>`}
      </div>`;
    }
    html += `<div class="list-row total-row" style="background:var(--surface2)"><div></div>
      <div class="row-main" style="font-weight:600">Weekly Total</div>
      <div class="row-right"><div class="row-amount" style="color:var(--red)">${fmt(totalW)}/wk</div>
        <div style="font-size:12px;color:var(--text2);text-align:right">~${fmt(totalW*52/12)}/mo</div>
      </div>
    </div></div>`;

  html += `<div class="section-label">Monthly Payments</div><div class="card-list expense-list">
    <div class="expense-table-head"><span></span><span>Item</span><span>Schedule</span><span>Amount</span><span></span></div>`;
  for (const b of monthly) {

    const personName = b.person === 'unassigned' ? 'Needs assignment' : data.names[b.person];

        : days <= 3 ? `<span style="color:var(--orange);font-weight:600;font-size:12px">in ${days}d</span>`
        : days <= 7 ? `<span style="color:var(--green);font-weight:600;font-size:12px">in ${days}d</span>`
        : `<span style="color:var(--text3);font-size:12px">day ${b.dueDay}</span>`)
      : `<span style="color:var(--text3);font-size:12px">various</span>`;
    html += `<div class="list-row" style="cursor:pointer" onclick="editingBillId=${b.id};addingBill=false;render()">

    </div>`;
  }
  html += `<div class="list-row total-row" style="background:var(--surface2)"><div></div>

        <div class="row-icon" style="background:var(--annual-soft)">${CAT_ICONS[b.cat]||'📋'}</div>
        <div class="row-main">
          <div class="row-title">${b.name}</div>
          <div class="row-sub" style="color:var(--orange)">${personName} · Annual · ${MONTHS[b.dueMonth-1]} ${b.dueDay || 1}${personalTag(b)}</div>

      <div class="row-main" style="font-weight:600">Annual Total</div>

  html += `<div class="section-label">Manage Spending</div><div class="settings-group">

  return html;
}

// ─── ITEM FORM ────────────────────────────────────────────────────────────────
function itemForm(type, item) {
  const isBill = type === 'bill';
  const isEdit = item !== null;
  const prefix = isEdit ? (isBill ? 'eb' : 'es') : (isBill ? 'nb' : 'ns');
  const cats = Object.keys(CAT_ICONS);
  const freqValue = isEdit && item.freq ? item.freq : 'monthly';
  const weekdayValue = isEdit && item.weekday != null ? item.weekday : 5;
  const amountLabel = freqValue === 'yearly' ? 'Annual payment' : freqValue === 'weekly' ? 'Weekly payment' : 'Monthly amount';
  const v = k => isEdit && item[k] != null ? item[k] : '';
  const sel = (k, val) => isEdit && item[k] === val ? 'selected' : '';
  const cancelAction = isEdit ? (isBill ? 'editingBillId=null' : 'editingSubId=null') : (isBill ? 'addingBill=false' : 'addingSub=false');
  const saveAction = isEdit ? `saveEdit('${type}',${item.id})` : `submitNew('${type}')`;
  const personValue = isEdit ? item.person : 'papa';
  const includeInTransfer = !isEdit || item.includeInTransfer !== false;
  return `<div class="add-form">
    <div style="font-weight:600;font-size:15px;margin-bottom:10px">${isEdit ? 'Edit' : 'New'} ${isBill ? 'Payment' : 'Subscription'}</div>
    <div class="form-grid full"><div class="form-field">
      <span class="form-label">Name</span>
      <input id="${prefix}-name" class="form-input" type="text" value="${v('name')}" placeholder="e.g. Netflix" autocomplete="off">
    </div></div>
    <div class="form-grid">
      <div class="form-field">
        <span class="form-label" id="${prefix}-amount-label">${amountLabel}</span>
        <input id="${prefix}-amount" class="form-input" type="number" inputmode="decimal" value="${v('amount')}" placeholder="0">
      </div>
      <div class="form-field">
        <span class="form-label">Category</span>
        <select id="${prefix}-cat" class="form-select">
          ${cats.map(c=>`<option value="${c}" ${sel('cat',c)}>${CAT_ICONS[c]} ${categoryLabel(c)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="form-grid">
      <div class="form-field">
        <span class="form-label">Person</span>
        <select id="${prefix}-person" class="form-select">
          <option value="papa" ${personValue === 'papa' ? 'selected' : ''}>${data.names.papa}</option>
          <option value="mama" ${personValue === 'mama' ? 'selected' : ''}>${data.names.mama}</option>
          ${personValue === 'unassigned' ? '<option value="unassigned" selected>Needs assignment</option>' : ''}
        </select>
      </div>
      <div class="form-field">
        <span class="form-label">Frequency</span>
        <select id="${prefix}-freq" class="form-select" onchange="updateDueMonthVisibility('${prefix}')">
          <option value="monthly" ${sel('freq','monthly')}>Monthly</option>
          <option value="weekly" ${sel('freq','weekly')}>Weekly</option>
          <option value="yearly" ${sel('freq','yearly')}>Yearly</option>
        </select>
      </div>
    </div>
    <div class="form-grid">
      <div class="form-field" id="${prefix}-dueday-field" ${freqValue === 'weekly' ? 'hidden' : ''}>
        <span class="form-label" id="${prefix}-dueday-label">${freqValue === 'yearly' ? 'Payment day' : 'Due day (0 = various)'}</span>
        <input id="${prefix}-dueday" class="form-input" type="number" inputmode="numeric" value="${isEdit ? item.dueDay : 0}" min="0" max="31">
      </div>
      <div class="form-field" id="${prefix}-duemonth-field" ${freqValue === 'yearly' ? '' : 'hidden'}>
        <span class="form-label">Payment month</span>
        <select id="${prefix}-duemonth" class="form-select">
          ${MONTHS.map((m,i)=>`<option value="${i+1}" ${isEdit && item.dueMonth===i+1?'selected':''}>${m}</option>`).join('')}
        </select>
      </div>
      <div class="form-field" id="${prefix}-weekday-field" ${freqValue === 'weekly' ? '' : 'hidden'}>
        <span class="form-label">Payment day</span>
        <select id="${prefix}-weekday" class="form-select">
          ${WEEKDAYS.map((day,index)=>`<option value="${index}" ${weekdayValue === index ? 'selected' : ''}>${day}</option>`).join('')}
        </select>
      </div>
    </div>
    <label class="transfer-check">
      <input id="${prefix}-include-transfer" type="checkbox" ${includeInTransfer ? 'checked' : ''}>
      <span>Include in household transfer guidance</span>
    </label>
    <div class="form-actions">
      <button class="btn-save" onclick="${saveAction}">${isEdit ? 'Save' : 'Add'}</button>
      <button class="btn-cancel" onclick="${cancelAction};render()">Cancel</button>
    </div>
  </div>`;
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
function updatePerson(person, key, value) {
  if (key === 'name') data.names[person] = value.trim() || (person === 'papa' ? 'Papa' : 'Mama');
  if (key === 'income') data.income[person] = +value || 0;
  save();
  render();
}

function updatePaySchedule(person, value) {
  if (person !== 'papa' && person !== 'mama') return;
  data.paySchedule.anchorDates[person] = parseLocalDate(value) ? value : '';
  expandedPayPeriods.clear();
  payPeriodsInitialized = false;
  save();
  render();
}

function updatePaycheck(person, value) {
  data.paySchedule.paychecks[person] = Math.max(0, +value || 0);
  save();
  render();
}

function updatePayTransfer(key, value) {
  if (key === 'from') data.paySchedule.transfer.from = value === 'mama' ? 'mama' : 'papa';
  if (key === 'amount') data.paySchedule.transfer.amount = Math.max(0, +value || 0);
  save();
  render();
}

function updateDueMonthVisibility(prefix) {
  const freq = document.getElementById(`${prefix}-freq`);
  const monthField = document.getElementById(`${prefix}-duemonth-field`);
  const dayField = document.getElementById(`${prefix}-dueday-field`);
  const weekdayField = document.getElementById(`${prefix}-weekday-field`);
  if (freq && monthField) monthField.hidden = freq.value !== 'yearly';
  if (freq && dayField) dayField.hidden = freq.value === 'weekly';
  if (freq && weekdayField) weekdayField.hidden = freq.value !== 'weekly';
  const amountLabel = document.getElementById(`${prefix}-amount-label`);
  const dueDayLabel = document.getElementById(`${prefix}-dueday-label`);
  if (amountLabel && freq) amountLabel.textContent = freq.value === 'yearly' ? 'Annual payment' : freq.value === 'weekly' ? 'Weekly payment' : 'Monthly amount';
  if (dueDayLabel && freq) dueDayLabel.textContent = freq.value === 'yearly' ? 'Payment day' : 'Due day (0 = various)';
}

function setBillFilter(f) { billFilter = f; render(); }
function deleteBill(id) {
  if (!confirm('Delete this payment?')) return;
  data.expenses = data.expenses.filter(item => !(item.type === 'bill' && item.id === id));
  save(); render();
}
function deleteSub(id) {
  if (!confirm('Delete this subscription?')) return;
  data.expenses = data.expenses.filter(item => !(item.type === 'subscription' && item.id === id));
  save(); render();
}
function submitNew(type) {
  const isBill = type === 'bill';
  const p = isBill ? 'nb' : 'ns';
  const name = document.getElementById(`${p}-name`).value.trim();
  const amount = parseFloat(document.getElementById(`${p}-amount`).value);
  const freq = document.getElementById(`${p}-freq`).value;
  const enteredDueDay = parseInt(document.getElementById(`${p}-dueday`).value) || 0;
  const dueDay = freq === 'weekly' ? 0 : freq === 'yearly' ? enteredDueDay || 1 : enteredDueDay;
  const dueMonth = parseInt(document.getElementById(`${p}-duemonth`).value) || 1;
  const weekday = parseInt(document.getElementById(`${p}-weekday`).value);
  const cat = document.getElementById(`${p}-cat`).value;
  const person = document.getElementById(`${p}-person`).value;
  const includeInTransfer = document.getElementById(`${p}-include-transfer`).checked;
  if (!name || isNaN(amount) || amount <= 0) { alert('Please enter a name and amount.'); return; }
  const newId = nextExpenseId();
  if (isBill) {
    const bill = { id:newId, type:'bill', name, amount, dueDay, person, freq, cat, note:'', includeInTransfer };
    if (freq === 'yearly') bill.dueMonth = dueMonth;
    if (freq === 'weekly') bill.weekday = Number.isFinite(weekday) ? weekday : 5;
    data.expenses.push(bill);
    addingBill = false;
  } else {
    const sub = { id:newId, type:'subscription', name, amount, dueDay, person, freq, cat, includeInTransfer };
    if (freq === 'yearly') sub.dueMonth = dueMonth;
    if (freq === 'weekly') sub.weekday = Number.isFinite(weekday) ? weekday : 5;
    data.expenses.push(sub);
    addingSub = false;
  }
  save(); render();
}

function saveEdit(type, id) {
  const isBill = type === 'bill';
  const p = isBill ? 'eb' : 'es';
  const name = document.getElementById(p+'-name').value.trim();
  const amount = parseFloat(document.getElementById(p+'-amount').value);
  const freq = document.getElementById(p+'-freq').value;
  const enteredDueDay = parseInt(document.getElementById(p+'-dueday').value) || 0;
  const dueDay = freq === 'weekly' ? 0 : freq === 'yearly' ? enteredDueDay || 1 : enteredDueDay;
  const dueMonth = parseInt(document.getElementById(p+'-duemonth').value) || 1;
  const weekday = parseInt(document.getElementById(p+'-weekday').value);
  const cat = document.getElementById(p+'-cat').value;
  const person = document.getElementById(p+'-person').value;
  const includeInTransfer = document.getElementById(p+'-include-transfer').checked;
  if (!name || isNaN(amount) || amount <= 0) { alert('Please enter a name and amount.'); return; }
  if (isBill) {
    const b = data.expenses.find(x => x.type === 'bill' && x.id === id);
    if (b) {
      b.name=name; b.amount=amount; b.freq=freq; b.dueDay=dueDay; b.cat=cat; b.person=person; b.includeInTransfer=includeInTransfer;
      if (freq==='yearly') b.dueMonth=dueMonth; else delete b.dueMonth;
      if (freq==='weekly') b.weekday=Number.isFinite(weekday) ? weekday : 5; else delete b.weekday;
    }
    editingBillId = null;
  } else {
    const s = data.expenses.find(x => x.type === 'subscription' && x.id === id);
    if (s) {
      s.name=name; s.amount=amount; s.freq=freq; s.dueDay=dueDay; s.cat=cat; s.person=person; s.includeInTransfer=includeInTransfer;
      if (freq==='yearly') s.dueMonth=dueMonth; else delete s.dueMonth;
      if (freq==='weekly') s.weekday=Number.isFinite(weekday) ? weekday : 5; else delete s.weekday;
    }
    editingSubId = null;
  }
  save(); render();
}

// ─── RENDER CHART SECTION ────────────────────────────────────────────────────
function buildDonut(entries, total) {
  const size = 200, cx = 100, cy = 100, r = 68, sw = 28;
  const C = 2 * Math.PI * r;
  let cumulative = 0;
  let segments = '';
  for (const e of entries) {
    const dash = (e.val / total) * C;
    const dashOffset = C * 0.25 - cumulative;
    cumulative += dash;
    segments += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
      stroke="${e.color}" stroke-width="${sw}"
      stroke-dasharray="${dash.toFixed(2)} ${(C - dash).toFixed(2)}"
      stroke-dashoffset="${dashOffset.toFixed(2)}"
      stroke-linecap="butt"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--sep)" stroke-width="${sw}"/>
    ${segments}
    <text x="${cx}" y="${cy - 10}" text-anchor="middle" font-size="13" fill="var(--text2)" font-family="-apple-system,sans-serif">Monthly</text>
    <text x="${cx}" y="${cy + 12}" text-anchor="middle" font-size="18" fill="var(--text)" font-weight="700" font-family="-apple-system,sans-serif">${fmt(total)}</text>
  </svg>`;
}

function renderChartSection() {
  // Main chart: bills only (subs are tracked separately below)
  const totals = {};
  for (const b of expensesOf('bill')) {
    totals[b.cat] = (totals[b.cat] || 0) + monthlyEquiv(b);
  }
  const entries = Object.entries(totals)
    .map(([cat, val]) => ({ cat, val, color: CAT_COLORS[cat] || '#8E8E93', label: categoryLabel(cat), icon: CAT_ICONS[cat] || '📋' }))
    .filter(e => e.val > 0)
    .sort((a, b) => b.val - a.val);

  const total = entries.reduce((s, e) => s + e.val, 0);
  if (total === 0) return '';

  const donut = buildDonut(entries, total);

  // Legend
  const legend = entries.map(e => `
    <div class="legend-row">
      <div class="legend-dot" style="background:${e.color}"></div>
      <div class="legend-name">${e.icon} ${e.label}</div>
      <div class="legend-amt">${fmt(e.val)}</div>
      <div class="legend-pct">${(e.val/total*100).toFixed(0)}%</div>
    </div>`).join('');

  // Subscriptions chart: grouped by category
  const subTotals = {};
  for (const s of expensesOf('subscription')) {
    if (s.amount > 0) subTotals[s.cat] = (subTotals[s.cat] || 0) + monthlyEquiv(s);
  }
  const subEntries = Object.entries(subTotals)
    .map(([cat, val]) => ({ val, color: CAT_COLORS[cat] || '#8E8E93', label: categoryLabel(cat), icon: CAT_ICONS[cat] || '📱' }))
    .sort((a, b) => b.val - a.val);
  const subTotal = subEntries.reduce((s, e) => s + e.val, 0);

  const subSection = subEntries.length === 0 ? '' : `
    <div class="section-label">Subscriptions Breakdown</div>
    <div class="wide-card">
      <div class="donut-wrap">${buildDonut(subEntries, subTotal)}</div>
      <div class="legend-list">${subEntries.map(e => `
        <div class="legend-row">
          <div class="legend-dot" style="background:${e.color}"></div>
          <div class="legend-name">${e.icon} ${e.label}</div>
          <div class="legend-amt">${fmt(e.val)}</div>
          <div class="legend-pct">${(e.val/subTotal*100).toFixed(0)}%</div>
        </div>`).join('')}
      </div>
    </div>`;

  // Papa vs Mama split bar — adjusted for transfer so it reflects true burden
  const exchange = calcExchange(); // positive = papa sends to mama
  const papaTotal = totalMonthly('papa') + exchange;
  const mamaTotal = totalMonthly('mama') - exchange;
  const houseTotal = papaTotal + mamaTotal;
  const papaPct = houseTotal > 0 ? (papaTotal / houseTotal * 100).toFixed(0) : 50;
  const mamaPct = houseTotal > 0 ? (mamaTotal / houseTotal * 100).toFixed(0) : 50;

  const splitBar = `
    <div class="split-bar-wrap">
      <div class="split-row">
        <div class="split-label" style="color:var(--blue)">${data.names.papa}</div>
        <div class="split-track">
          <div class="split-fill" style="width:${papaPct}%;background:var(--blue)">${papaPct}%</div>
        </div>
        <div class="split-val">${fmt(papaTotal)}</div>
      </div>
      <div class="split-row">
        <div class="split-label" style="color:var(--purple)">${data.names.mama}</div>
        <div class="split-track">
          <div class="split-fill" style="width:${mamaPct}%;background:var(--purple)">${mamaPct}%</div>
        </div>
        <div class="split-val">${fmt(mamaTotal)}</div>
      </div>
    </div>`;

  return `
    <div class="section-label">Spending Breakdown</div>
    <div class="wide-card">
      <div class="donut-wrap">${donut}</div>
      <div class="legend-list">${legend}</div>
    </div>
    ${subSection}
    <div class="section-label">Expense Split</div>
    <div class="wide-card">${splitBar}</div>`;
}
// ─── RENDER DISPATCH ──────────────────────────────────────────────────────────
function render() {
  const titles = { home:'Overview', pay:'Cash Flow', bills:'Spending', subs:'Subscriptions' };
  document.getElementById('page-title').textContent = titles[currentTab];
  applyTheme();
  updateDocumentChrome();
  const showEdit = currentTab === 'bills' || currentTab === 'subs';
  document.getElementById('edit-btn').style.display = showEdit ? 'flex' : 'none';
  const map = { home:renderHome, pay:renderPayPeriods, bills:renderBills, subs:renderSubs };
  document.getElementById('main').innerHTML = (map[currentTab] || renderHome)();
}

function registerAppUpdater() {
  if (typeof navigator === 'undefined' || !('serviceWorker' in navigator)) return;
  window.addEventListener('load', async () => {
    try {
      const registration = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
      await registration.update();
    } catch (error) {
      console.warn('App update check unavailable.', error);
    }
  });
}

registerAppUpdater();
render();
</script>
